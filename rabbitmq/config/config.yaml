# RabbitMQ AMQP 地址，用于消费派单命令队列。
url: amqp://127.0.0.1:5672/
username: guest
password: guest
# RabbitMQ Stream 服务地址和端口，用于写入司机定位事件。
stream-host: 127.0.0.1
stream-port: 5552
# 定位事件使用的 Super Stream 名称。
stream-name: stream-location
stream-consumer-name: go-demo-stream-consumer
# 声明 Super Stream 时创建的分区数量。
stream-partitions: 8
# 每个 Stream 分区流的最大保留容量，单位为 GB。
stream-max-length-gb: 2
# RabbitMQ Stream 专用账号，与上面的 AMQP 连接凭证分开配置。
stream-username: guest
stream-password: guest
